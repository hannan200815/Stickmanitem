# ================================================================
#  StickmanItems configuration
# ================================================================
#
#  How to edit this file:
#    - Change a number, save, then restart the server.
#    - Cooldowns are in seconds.
#    - 20 ticks = 1 second, where a setting asks for ticks.
#    - Chances are between 0 and 1 (0.15 = 15%).
#

# ================================================================
#  Weapon and gem damage
# ================================================================
damage:
  # Melee damage multiplier for held weapons (1.0 = normal).
  weapon-multiplier: 1.0
  # Gem damage multiplier (1.5 = original).
  gem-multiplier: 1.5

# ================================================================
#  Cooldowns (seconds)
# ================================================================
# One line per ability. A second ability (sneak + right-click) ends in 2.
cooldowns:
  anchor: 10   # Anchor Maul
  anchor2: 12   # Anchor Maul (second ability)
  conch: 8   # Conch Spear
  conch2: 14   # Conch Spear (second ability)
  kraken: 12   # Kraken
  kraken2: 12   # Kraken (second ability)
  leviathan: 8   # Leviathan Blade
  leviathan2: 15   # Leviathan Blade (second ability)
  octopus: 10   # Octopus
  octopus2: 9   # Octopus (second ability)
  poseidon: 15   # Poseidon
  poseidon2: 12   # Poseidon (second ability)
  sharktooth: 9   # Shark's Tooth
  sharktooth2: 10   # Shark's Tooth (second ability)
  tsunami: 20   # Tsunami Overlord
  tsunami2: 15   # Tsunami Overlord (second ability)
  bloodmoon: 10.0   # Bloodmoon Scythe
  cryptbone: 7.0   # Crypt Bone
  duskblade: 9.0   # Dusk Blade
  embershort: 7   # Ember Shortspear
  glacierhalberd: 10.0   # Glacier Halberd
  hyperion: 8.0   # Hyperion Blade
  infernowand: 1.0   # Inferno Wand
  ironbulwark: 11.0   # Iron Bulwark
  lanternstaff: 4.0   # Lantern Staff
  mistral: 7   # Mistral Spear
  obsidianfist: 9.0   # Obsidian Fist
  prismblade: 6.0   # Prism Blade
  runescythe: 7.0   # Rune Scythe
  solstice: 10   # Solstice Hammer
  starshard: 8.0   # Starshard Scepter
  tempesthalberd: 8.0   # Tempest Halberd
  thundercudgel: 8.0   # Thunder Cudgel
  voidfang: 5.0   # Voidfang Dagger

# ================================================================
#  Items - ocean group (balanced)
# ================================================================
# Power scale: Poseidon 1st (strongest), Kraken 2nd, Shark's Tooth 3rd, Octopus 4th (weakest).
# Tsunami Overlord, Leviathan Blade, Anchor Maul and Conch Spear are unranked.
